name: RDStore API CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_BASE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/rdstore-api:latest
  RESOURCE_GROUP: rg-rdstore-happy-aphid
  ENVIRONMENT_NAME: rdstore-env
  CONTAINER_APP_NAME: rdstore-api

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t $IMAGE_BASE_NAME .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: docker push $IMAGE_BASE_NAME

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.CLIENT_ID }}","clientSecret":"${{ secrets.CLIENT_SECRET }}","subscriptionId":"${{ secrets.SUBSCRIPTION_ID }}","tenantId":"${{ secrets.TENANT_ID }}"}'

      - name: Install Azure Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy RDStore to Azure Container Apps
        run: |
          az containerapp up \
            --name $CONTAINER_APP_NAME \
            --image $IMAGE_BASE_NAME \
            --resource-group $RESOURCE_GROUP \
            --environment $ENVIRONMENT_NAME \
            --ingress external \
            --target-port 8080

      - name: Configure Container App secrets
        run: |
          az containerapp secret set \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --secrets \
              jwt-secret="${{ secrets.JWT_SECRET }}" \
              appinsights-connection-string="${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}" \
              db-url="${{ secrets.DB_URL }}" \
              db-username="${{ secrets.DB_USERNAME }}" \
              db-password="${{ secrets.DB_PASSWORD }}"

          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --set-env-vars \
              JWT_SECRET=secretref:jwt-secret \
              APPLICATIONINSIGHTS_CONNECTION_STRING=secretref:appinsights-connection-string \
              DB_URL=secretref:db-url \
              DB_USERNAME=secretref:db-username \
              DB_PASSWORD=secretref:db-password