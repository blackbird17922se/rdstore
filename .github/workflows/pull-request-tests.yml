name: Tests Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: dstore
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Give Maven Wrapper execution permission
        run: chmod +x mvnw

      - name: Run tests
        env:
          DB_USERNAME: root
          DB_PASSWORD: ci_password
          JWT_SECRET: ci-test-secret-key-for-rdstore-123456789
        run: ./mvnw --batch-mode test