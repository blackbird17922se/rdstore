name: Tests Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Give Maven Wrapper execution permission
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw --batch-mode test